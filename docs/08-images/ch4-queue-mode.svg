<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="400" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Le mode file d'attente (queue mode) : main, Redis, workers, PostgreSQL</text>

  <!-- Internet / reverse proxy -->
  <rect x="40" y="70" width="150" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="115" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">Reverse proxy</text>
  <text x="115" y="114" text-anchor="middle" font-size="10" fill="#57606a">HTTPS (Traefik/nginx)</text>

  <!-- Main instance -->
  <rect x="240" y="70" width="160" height="60" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <text x="320" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#bc4c00">Instance principale</text>
  <text x="320" y="114" text-anchor="middle" font-size="10" fill="#57606a">éditeur, déclencheurs, API</text>

  <!-- Redis -->
  <rect x="470" y="70" width="130" height="60" rx="10" fill="#fdf0ee" stroke="#cf222e" stroke-width="2"/>
  <text x="535" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">Redis</text>
  <text x="535" y="114" text-anchor="middle" font-size="10" fill="#57606a">file des exécutions</text>

  <!-- PostgreSQL -->
  <rect x="670" y="70" width="170" height="60" rx="10" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <text x="755" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#1f883d">PostgreSQL</text>
  <text x="755" y="114" text-anchor="middle" font-size="10" fill="#57606a">workflows, credentials, exécutions</text>

  <!-- Flèches haut -->
  <line x1="190" y1="100" x2="240" y2="100" stroke="#57606a" stroke-width="2"/>
  <polygon points="240,100 230,94 230,106" fill="#57606a"/>
  <line x1="400" y1="100" x2="470" y2="100" stroke="#57606a" stroke-width="2"/>
  <polygon points="470,100 460,94 460,106" fill="#57606a"/>
  <text x="435" y="90" text-anchor="middle" font-size="10" fill="#57606a">1. dépose l'exécution</text>
  <line x1="400" y1="118" x2="670" y2="118" stroke="#1f883d" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="535" y="133" text-anchor="middle" font-size="10" fill="#1f883d">lecture/écriture des définitions et résultats</text>

  <!-- Workers -->
  <rect x="240" y="200" width="160" height="60" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <text x="320" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Worker 1</text>
  <text x="320" y="244" text-anchor="middle" font-size="10" fill="#57606a">exécute les workflows</text>

  <rect x="440" y="200" width="160" height="60" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <text x="520" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Worker 2</text>
  <text x="520" y="244" text-anchor="middle" font-size="10" fill="#57606a">exécute les workflows</text>

  <rect x="640" y="200" width="160" height="60" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Worker N</text>
  <text x="720" y="244" text-anchor="middle" font-size="10" fill="#57606a">(on ajoute à la demande)</text>

  <!-- Flèches workers -->
  <line x1="535" y1="130" x2="400" y2="200" stroke="#cf222e" stroke-width="2"/>
  <polygon points="400,200 400,188 410,196" fill="#cf222e"/>
  <line x1="535" y1="130" x2="520" y2="200" stroke="#cf222e" stroke-width="2"/>
  <polygon points="520,200 514,190 526,190" fill="#cf222e"/>
  <line x1="535" y1="130" x2="720" y2="200" stroke="#cf222e" stroke-width="2"/>
  <polygon points="720,200 714,190 726,190" fill="#cf222e"/>
  <text x="640" y="168" text-anchor="middle" font-size="10" fill="#cf222e">2. le worker libre prend le message</text>

  <line x1="320" y1="200" x2="690" y2="130" stroke="#1f883d" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="480" y="160" text-anchor="middle" font-size="10" fill="#1f883d">3. écrit le résultat, notifie via Redis</text>

  <!-- Bandeau bas -->
  <rect x="40" y="300" width="800" height="78" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="324" font-size="12" fill="#1f2328"><tspan font-weight="700">Prérequis :</tspan> PostgreSQL (SQLite non supporté en queue mode), Redis accessible à tous,</text>
  <text x="60" y="342" font-size="12" fill="#1f2328">la même clé N8N_ENCRYPTION_KEY partagée par tous les processus, EXECUTIONS_MODE=queue.</text>
  <text x="60" y="363" font-size="12" fill="#57606a">L'éditeur reste sur l'instance principale ; les workers ne servent qu'à exécuter — la charge se règle en ajoutant des workers.</text>
</svg>
