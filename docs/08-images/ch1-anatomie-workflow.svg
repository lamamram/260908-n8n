<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="320" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Anatomie d'un workflow n8n</text>

  <!-- Déclencheur -->
  <rect x="40" y="110" width="170" height="80" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <rect x="40" y="110" width="10" height="80" rx="5" fill="#f0883e"/>
  <text x="130" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">Déclencheur</text>
  <text x="130" y="162" text-anchor="middle" font-size="12" fill="#57606a">(trigger)</text>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#57606a">au moins un requis</text>

  <!-- Flèche 1 -->
  <line x1="215" y1="150" x2="285" y2="150" stroke="#57606a" stroke-width="2"/>
  <polygon points="285,150 275,144 275,156" fill="#57606a"/>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#57606a">items</text>

  <!-- Nœud 1 -->
  <rect x="290" y="110" width="150" height="80" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="365" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">Nœud d'action</text>
  <text x="365" y="162" text-anchor="middle" font-size="12" fill="#57606a">HTTP Request</text>
  <text x="365" y="180" text-anchor="middle" font-size="11" fill="#57606a">reçoit les items</text>

  <!-- Flèche 2 -->
  <line x1="445" y1="150" x2="515" y2="150" stroke="#57606a" stroke-width="2"/>
  <polygon points="515,150 505,144 505,156" fill="#57606a"/>
  <text x="480" y="138" text-anchor="middle" font-size="11" fill="#57606a">items</text>

  <!-- Nœud 2 -->
  <rect x="520" y="110" width="150" height="80" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="595" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1f883d">Nœud d'action</text>
  <text x="595" y="162" text-anchor="middle" font-size="12" fill="#57606a">Edit Fields (Set)</text>
  <text x="595" y="180" text-anchor="middle" font-size="11" fill="#57606a">transforme les items</text>

  <!-- Flèche 3 -->
  <line x1="675" y1="150" x2="745" y2="150" stroke="#57606a" stroke-width="2"/>
  <polygon points="745,150 735,144 735,156" fill="#57606a"/>
  <text x="710" y="138" text-anchor="middle" font-size="11" fill="#57606a">items</text>

  <!-- Sortie -->
  <rect x="750" y="110" width="100" height="80" rx="10" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <text x="800" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1f883d">Sortie</text>
  <text x="800" y="166" text-anchor="middle" font-size="11" fill="#57606a">résultat</text>

  <!-- Légende bas -->
  <rect x="40" y="230" width="800" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="254" font-size="13" fill="#1f2328"><tspan font-weight="700">Règle d'or :</tspan> les données circulent de gauche à droite sous forme de <tspan font-weight="700">tableau d'items</tspan>.</text>
  <text x="60" y="276" font-size="13" fill="#1f2328">Chaque nœud traite les items un par un, puis transmet le tableau résultant au nœud suivant.</text>
</svg>
