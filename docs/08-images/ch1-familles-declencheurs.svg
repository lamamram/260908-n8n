<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Les quatre familles de déclencheurs n8n</text>

  <!-- Carte 1 : manuel -->
  <rect x="40" y="70" width="185" height="120" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <circle cx="132" cy="105" r="18" fill="#f6f8fa" stroke="#6e7781" stroke-width="2"/>
  <polygon points="127,97 127,113 141,105" fill="#6e7781"/>
  <text x="132" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Manuel</text>
  <text x="132" y="165" text-anchor="middle" font-size="11" fill="#57606a">Bouton « Test workflow »</text>
  <text x="132" y="181" text-anchor="middle" font-size="11" fill="#57606a">phase de construction</text>

  <!-- Carte 2 : planifié -->
  <rect x="250" y="70" width="185" height="120" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <circle cx="342" cy="105" r="18" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <line x1="342" y1="95" x2="342" y2="106" stroke="#0969da" stroke-width="2" stroke-linecap="round"/>
  <line x1="342" y1="106" x2="349" y2="110" stroke="#0969da" stroke-width="2" stroke-linecap="round"/>
  <text x="342" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Planifié</text>
  <text x="342" y="165" text-anchor="middle" font-size="11" fill="#57606a">Schedule Trigger</text>
  <text x="342" y="181" text-anchor="middle" font-size="11" fill="#57606a">intervalle ou cron</text>

  <!-- Carte 3 : webhook -->
  <rect x="460" y="70" width="185" height="120" rx="10" fill="#ffffff" stroke="#f0883e" stroke-width="2"/>
  <circle cx="552" cy="105" r="18" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <path d="M545 105 a7 7 0 1 1 7 -7" fill="none" stroke="#f0883e" stroke-width="2"/>
  <polygon points="556,94 560,99 553,101" fill="#f0883e"/>
  <text x="552" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Webhook</text>
  <text x="552" y="165" text-anchor="middle" font-size="11" fill="#57606a">URL HTTP appelée par</text>
  <text x="552" y="181" text-anchor="middle" font-size="11" fill="#57606a">un système externe</text>

  <!-- Carte 4 : événement applicatif -->
  <rect x="670" y="70" width="185" height="120" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <circle cx="762" cy="105" r="18" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <polygon points="755,97 773,105 755,113" fill="none" stroke="#1f883d" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="762" cy="105" r="3" fill="#1f883d"/>
  <text x="762" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Événement applicatif</text>
  <text x="762" y="165" text-anchor="middle" font-size="11" fill="#57606a">App trigger : Gmail,</text>
  <text x="762" y="181" text-anchor="middle" font-size="11" fill="#57606a">Slack, GitHub…</text>

  <!-- Flèches de comparaison polling/push -->
  <line x1="132" y1="215" x2="762" y2="215" stroke="#d0d7de" stroke-width="2"/>

  <!-- Bandeau polling -->
  <rect x="40" y="240" width="395" height="110" rx="10" fill="#fff8f2" stroke="#f0883e"/>
  <text x="237" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">Mode « polling » (interrogation)</text>
  <text x="237" y="290" text-anchor="middle" font-size="12" fill="#1f2328">n8n interroge le service à intervalle régulier :</text>
  <text x="237" y="308" text-anchor="middle" font-size="12" fill="#1f2328">« y a-t-il du nouveau ? »</text>
  <text x="237" y="330" text-anchor="middle" font-size="12" fill="#57606a">Simple à configurer, mais délai détecté à la fréquence choisie.</text>

  <!-- Bandeau push -->
  <rect x="460" y="240" width="395" height="110" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="657" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">Mode « push » (webhook)</text>
  <text x="657" y="290" text-anchor="middle" font-size="12" fill="#1f2328">Le service appelle immédiatement l'URL du</text>
  <text x="657" y="308" text-anchor="middle" font-size="12" fill="#1f2328">webhook n8n dès que l'événement se produit.</text>
  <text x="657" y="330" text-anchor="middle" font-size="12" fill="#57606a">Temps réel, mais le service doit savoir appeler un webhook.</text>
</svg>
