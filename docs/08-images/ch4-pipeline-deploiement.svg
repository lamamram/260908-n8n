<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Du développement à la production : le circuit d'un workflow</text>

  <!-- Dev -->
  <rect x="40" y="90" width="180" height="100" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="130" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">Développement</text>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#57606a">instance locale /</text>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#57606a">instance de dev</text>
  <text x="130" y="176" text-anchor="middle" font-size="10" fill="#57606a">données épinglées, écho httpbin</text>

  <!-- Flèche 1 -->
  <line x1="225" y1="140" x2="280" y2="140" stroke="#57606a" stroke-width="2"/>
  <polygon points="280,140 270,134 270,146" fill="#57606a"/>
  <text x="252" y="128" text-anchor="middle" font-size="10" fill="#57606a">export JSON</text>

  <!-- Git -->
  <rect x="285" y="90" width="160" height="100" rx="10" fill="#f6f8fa" stroke="#6e7781" stroke-width="2"/>
  <text x="365" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Dépôt Git</text>
  <text x="365" y="138" text-anchor="middle" font-size="11" fill="#57606a">versions, revues,</text>
  <text x="365" y="154" text-anchor="middle" font-size="11" fill="#57606a">historique</text>
  <text x="365" y="176" text-anchor="middle" font-size="10" fill="#57606a">aucun secret dans le JSON</text>

  <!-- Flèche 2 -->
  <line x1="450" y1="140" x2="505" y2="140" stroke="#57606a" stroke-width="2"/>
  <polygon points="505,140 495,134 495,146" fill="#57606a"/>
  <text x="477" y="128" text-anchor="middle" font-size="10" fill="#57606a">import</text>

  <!-- Recette -->
  <rect x="510" y="90" width="160" height="100" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <text x="590" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">Recette</text>
  <text x="590" y="138" text-anchor="middle" font-size="11" fill="#57606a">instance miroir,</text>
  <text x="590" y="154" text-anchor="middle" font-size="11" fill="#57606a">credentials de test</text>
  <text x="590" y="176" text-anchor="middle" font-size="10" fill="#57606a">validation métier</text>

  <!-- Flèche 3 -->
  <line x1="675" y1="140" x2="730" y2="140" stroke="#57606a" stroke-width="2"/>
  <polygon points="730,140 720,134 720,146" fill="#57606a"/>
  <text x="702" y="128" text-anchor="middle" font-size="10" fill="#57606a">déploiement</text>

  <!-- Prod -->
  <rect x="735" y="90" width="120" height="100" rx="10" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <text x="795" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1f883d">Production</text>
  <text x="795" y="138" text-anchor="middle" font-size="11" fill="#57606a">workflow actif,</text>
  <text x="795" y="154" text-anchor="middle" font-size="11" fill="#57606a">supervisé</text>

  <!-- Bandeau bas -->
  <rect x="40" y="230" width="800" height="88" rx="8" fill="#fff8f2" stroke="#f0883e"/>
  <text x="60" y="254" font-size="12" fill="#1f2328"><tspan font-weight="700">Règles du circuit :</tspan></text>
  <text x="60" y="274" font-size="12" fill="#1f2328">• le JSON exporté ne contient jamais les secrets (les credentials sont référencés par nom, recréés par instance) ;</text>
  <text x="60" y="292" font-size="12" fill="#1f2328">• on ne modifie jamais directement en production — tout changement repasse par dev et recette ;</text>
  <text x="60" y="310" font-size="12" fill="#1f2328">• la fonction « source control » de n8n (selon édition) automatise ce circuit Git depuis l'éditeur.</text>
</svg>
