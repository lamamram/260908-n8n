<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Le modèle de données n8n : un tableau d'items</text>

  <!-- Nœud amont -->
  <rect x="40" y="120" width="130" height="110" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="105" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Nœud</text>
  <text x="105" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">amont</text>
  <text x="105" y="208" text-anchor="middle" font-size="11" fill="#57606a">ex. HTTP Request</text>

  <!-- Flèche -->
  <line x1="175" y1="175" x2="235" y2="175" stroke="#57606a" stroke-width="2"/>
  <polygon points="235,175 225,169 225,181" fill="#57606a"/>

  <!-- Tableau d'items -->
  <rect x="240" y="70" width="400" height="230" rx="10" fill="#ffffff" stroke="#f0883e" stroke-width="2"/>
  <text x="440" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">[ tableau d'items ]</text>

  <!-- Item 1 -->
  <rect x="258" y="110" width="364" height="50" rx="6" fill="#fff8f2" stroke="#f0883e"/>
  <text x="270" y="130" font-size="12" font-weight="700" fill="#1f2328">Item 0</text>
  <text x="270" y="148" font-size="11" fill="#57606a">{ "json": { "nom": "Dupont", "email": "a@ex.fr" } }</text>

  <!-- Item 2 -->
  <rect x="258" y="168" width="364" height="50" rx="6" fill="#fff8f2" stroke="#f0883e"/>
  <text x="270" y="188" font-size="12" font-weight="700" fill="#1f2328">Item 1</text>
  <text x="270" y="206" font-size="11" fill="#57606a">{ "json": { "nom": "Martin", "email": "b@ex.fr" } }</text>

  <!-- Item 3 -->
  <rect x="258" y="226" width="364" height="50" rx="6" fill="#fff8f2" stroke="#f0883e"/>
  <text x="270" y="246" font-size="12" font-weight="700" fill="#1f2328">Item 2</text>
  <text x="270" y="264" font-size="11" fill="#57606a">{ "json": { "nom": "Diallo", "email": "c@ex.fr" } }</text>

  <!-- Flèche -->
  <line x1="645" y1="175" x2="705" y2="175" stroke="#57606a" stroke-width="2"/>
  <polygon points="705,175 695,169 695,181" fill="#57606a"/>

  <!-- Nœud aval -->
  <rect x="710" y="120" width="130" height="110" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="775" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1f883d">Nœud</text>
  <text x="775" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1f883d">aval</text>
  <text x="775" y="208" text-anchor="middle" font-size="11" fill="#57606a">ex. Edit Fields</text>

  <!-- Note bas -->
  <rect x="40" y="315" width="800" height="32" rx="8" fill="#eaf5ea" stroke="#1f883d"/>
  <text x="440" y="336" text-anchor="middle" font-size="13" fill="#1f2328">Le nœud aval s'exécute <tspan font-weight="700">une fois par item</tspan> : 3 items en entrée = 3 exécutions internes.</text>
</svg>
