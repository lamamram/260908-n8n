<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Le motif « boucle par lots » : Loop Over Items + Wait</text>

  <!-- Tableau d'entrée -->
  <rect x="40" y="80" width="150" height="120" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <text x="115" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Tableau d'entrée</text>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#57606a">300 items</text>
  <text x="115" y="146" text-anchor="middle" font-size="11" fill="#57606a">(contacts à écrire</text>
  <text x="115" y="162" text-anchor="middle" font-size="11" fill="#57606a">dans le CRM)</text>

  <!-- Flèche vers Loop -->
  <line x1="195" y1="140" x2="245" y2="140" stroke="#57606a" stroke-width="2"/>
  <polygon points="245,140 235,134 235,146" fill="#57606a"/>

  <!-- Loop Over Items -->
  <rect x="250" y="80" width="170" height="120" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <text x="335" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">Loop Over Items</text>
  <text x="335" y="126" text-anchor="middle" font-size="11" fill="#57606a">Batch Size : 10</text>
  <rect x="265" y="140" width="140" height="46" rx="6" fill="#ffffff" stroke="#f0883e"/>
  <text x="335" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328">sortie « loop »</text>
  <text x="335" y="175" text-anchor="middle" font-size="10" fill="#57606a">1 lot de 10 items</text>

  <!-- Flèche vers traitement -->
  <line x1="425" y1="150" x2="475" y2="150" stroke="#57606a" stroke-width="2"/>
  <polygon points="475,150 465,144 465,156" fill="#57606a"/>

  <!-- Traitement API -->
  <rect x="480" y="100" width="150" height="80" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="555" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Appel API</text>
  <text x="555" y="152" text-anchor="middle" font-size="11" fill="#57606a">(nœud HTTP Request)</text>

  <!-- Flèche vers Wait -->
  <line x1="635" y1="140" x2="685" y2="140" stroke="#57606a" stroke-width="2"/>
  <polygon points="685,140 675,134 675,146" fill="#57606a"/>

  <!-- Wait -->
  <rect x="690" y="100" width="150" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="765" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Wait</text>
  <text x="765" y="152" text-anchor="middle" font-size="11" fill="#57606a">pause 2 s</text>

  <!-- Retour boucle -->
  <path d="M 765 185 L 765 260 L 335 260 L 335 205" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="335,205 329,215 341,215" fill="#f0883e"/>
  <text x="550" y="280" text-anchor="middle" font-size="12" fill="#bc4c00">retour au lot suivant (tant qu'il reste des items)</text>

  <!-- Sortie done -->
  <line x1="335" y1="80" x2="335" y2="45" stroke="#1f883d" stroke-width="2"/>
  <polygon points="335,45 329,55 341,55" fill="#1f883d"/>
  <text x="440" y="55" font-size="12" font-weight="700" fill="#1f883d">sortie « done » : tous les lots traités → suite du flux</text>

  <!-- Bandeau bas -->
  <rect x="40" y="300" width="800" height="44" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="440" y="320" text-anchor="middle" font-size="12" fill="#1f2328">Le nœud boucle découpe le tableau en lots et renvoie chaque lot par sa sortie « loop » ;</text>
  <text x="440" y="336" text-anchor="middle" font-size="12" fill="#1f2328">quand tout est traité, la sortie « done » libère la suite. Aucun IF de fin n'est nécessaire.</text>
</svg>
