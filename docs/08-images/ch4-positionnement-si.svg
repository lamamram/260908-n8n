<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="360" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">n8n au centre du système d'information : les quatre flux typiques</text>

  <!-- Centre : n8n -->
  <rect x="340" y="140" width="200" height="90" rx="12" fill="#fff4e5" stroke="#f0883e" stroke-width="3"/>
  <text x="440" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#bc4c00">n8n</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#57606a">orchestrateur</text>

  <!-- Applications autour -->
  <rect x="40" y="60" width="170" height="55" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="125" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">Applications SaaS</text>
  <text x="125" y="102" text-anchor="middle" font-size="10" fill="#57606a">CRM, messagerie, tableurs</text>

  <rect x="670" y="60" width="170" height="55" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="755" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1f883d">Outils internes</text>
  <text x="755" y="102" text-anchor="middle" font-size="10" fill="#57606a">ERP, bases de données, fichiers</text>

  <rect x="40" y="255" width="170" height="55" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <text x="125" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">Applications métier</text>
  <text x="125" y="297" text-anchor="middle" font-size="10" fill="#57606a">développements full-code</text>

  <rect x="670" y="255" width="170" height="55" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="755" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#8250df">Humains</text>
  <text x="755" y="297" text-anchor="middle" font-size="10" fill="#57606a">formulaires, validations, alertes</text>

  <!-- Flux 1 : SaaS -> n8n -->
  <line x1="210" y1="95" x2="340" y2="160" stroke="#0969da" stroke-width="2"/>
  <polygon points="340,160 330,155 336,166" fill="#0969da"/>
  <text x="255" y="112" font-size="10" fill="#0969da">1. événements (webhooks, polling)</text>

  <!-- Flux 2 : n8n -> interne -->
  <line x1="540" y1="160" x2="670" y2="95" stroke="#1f883d" stroke-width="2"/>
  <polygon points="670,95 660,94 667,104" fill="#1f883d"/>
  <text x="585" y="112" font-size="10" fill="#1f883d">2. écritures (API, SQL, fichiers)</text>

  <!-- Flux 3 : métier <-> n8n -->
  <line x1="210" y1="275" x2="340" y2="215" stroke="#6e7781" stroke-width="2"/>
  <polygon points="340,215 330,212 336,222" fill="#6e7781"/>
  <text x="212" y="245" font-size="10" fill="#6e7781">3. appels réciproques (API exposée par webhook)</text>

  <!-- Flux 4 : n8n <-> humains -->
  <line x1="670" y1="275" x2="540" y2="215" stroke="#8250df" stroke-width="2"/>
  <polygon points="540,215 534,222 544,222" fill="#8250df"/>
  <text x="575" y="245" font-size="10" fill="#8250df">4. notifications, validations (Wait, formulaires)</text>

  <!-- Bandeau bas -->
  <rect x="40" y="325" width="800" height="26" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="440" y="343" text-anchor="middle" font-size="12" fill="#1f2328">n8n ne remplace aucun de ces systèmes : il les fait parler ensemble, avec une logique visible et modifiable par tous.</text>
</svg>
