<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="340" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Normaliser les données entre deux schémas hétérogènes</text>

  <!-- Service A -->
  <rect x="40" y="70" width="220" height="170" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="150" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">Service source</text>
  <text x="150" y="114" text-anchor="middle" font-size="11" fill="#57606a">(boutique en ligne)</text>
  <rect x="55" y="130" width="190" height="26" rx="5" fill="#ddf4ff"/>
  <text x="65" y="147" font-size="11" fill="#1f2328">customer_name (texte)</text>
  <rect x="55" y="162" width="190" height="26" rx="5" fill="#ddf4ff"/>
  <text x="65" y="179" font-size="11" fill="#1f2328">mail (texte, casse libre)</text>
  <rect x="55" y="194" width="190" height="26" rx="5" fill="#ddf4ff"/>
  <text x="65" y="211" font-size="11" fill="#1f2328">ordered_at (« 12/03/2026 »)</text>

  <!-- Flèche -->
  <line x1="265" y1="155" x2="320" y2="155" stroke="#57606a" stroke-width="2"/>
  <polygon points="320,155 310,149 310,161" fill="#57606a"/>

  <!-- Zone n8n -->
  <rect x="325" y="70" width="230" height="170" rx="10" fill="#fff8f2" stroke="#f0883e" stroke-width="2"/>
  <text x="440" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#bc4c00">Workflow n8n</text>
  <text x="440" y="114" text-anchor="middle" font-size="11" fill="#57606a">(Edit Fields + expressions)</text>
  <rect x="340" y="130" width="200" height="26" rx="5" fill="#fff4e5"/>
  <text x="350" y="147" font-size="11" fill="#1f2328">renommer : customer_name → nom</text>
  <rect x="340" y="162" width="200" height="26" rx="5" fill="#fff4e5"/>
  <text x="350" y="179" font-size="11" fill="#1f2328">normaliser : mail en minuscules</text>
  <rect x="340" y="194" width="200" height="26" rx="5" fill="#fff4e5"/>
  <text x="350" y="211" font-size="11" fill="#1f2328">convertir : date → ISO 8601</text>

  <!-- Flèche -->
  <line x1="560" y1="155" x2="615" y2="155" stroke="#57606a" stroke-width="2"/>
  <polygon points="615,155 605,149 605,161" fill="#57606a"/>

  <!-- Service B -->
  <rect x="620" y="70" width="220" height="170" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="730" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1f883d">Service cible</text>
  <text x="730" y="114" text-anchor="middle" font-size="11" fill="#57606a">(CRM)</text>
  <rect x="635" y="130" width="190" height="26" rx="5" fill="#eaf5ea"/>
  <text x="645" y="147" font-size="11" fill="#1f2328">nom (obligatoire)</text>
  <rect x="635" y="162" width="190" height="26" rx="5" fill="#eaf5ea"/>
  <text x="645" y="179" font-size="11" fill="#1f2328">email (minuscules exigées)</text>
  <rect x="635" y="194" width="190" height="26" rx="5" fill="#eaf5ea"/>
  <text x="645" y="211" font-size="11" fill="#1f2328">date_commande (ISO 8601)</text>

  <!-- Bandeau bas -->
  <rect x="40" y="270" width="800" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="440" y="291" text-anchor="middle" font-size="13" fill="#1f2328">Le workflow joue le rôle de <tspan font-weight="700">traducteur de schémas</tspan> : à chaque champ de la cible,</text>
  <text x="440" y="309" text-anchor="middle" font-size="13" fill="#1f2328">on associe une expression qui lit, renomme, convertit ou formate la donnée source.</text>
</svg>
