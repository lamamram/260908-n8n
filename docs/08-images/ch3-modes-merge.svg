<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Le nœud Merge : quatre façons de combiner deux entrées</text>

  <!-- Entrées communes -->
  <rect x="30" y="70" width="130" height="60" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="95" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">Entrée 1</text>
  <text x="95" y="114" text-anchor="middle" font-size="10" fill="#57606a">contacts CRM</text>

  <rect x="30" y="250" width="130" height="60" rx="8" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <text x="95" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1f883d">Entrée 2</text>
  <text x="95" y="294" text-anchor="middle" font-size="10" fill="#57606a">inscriptions web</text>

  <!-- Append -->
  <rect x="200" y="60" width="300" height="130" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <text x="350" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Append</text>
  <rect x="220" y="100" width="120" height="30" rx="5" fill="#ddf4ff"/>
  <text x="280" y="119" text-anchor="middle" font-size="10" fill="#1f2328">items de l'entrée 1</text>
  <rect x="350" y="100" width="120" height="30" rx="5" fill="#eaf5ea"/>
  <text x="410" y="119" text-anchor="middle" font-size="10" fill="#1f2328">puis items de l'entrée 2</text>
  <text x="350" y="155" text-anchor="middle" font-size="11" fill="#57606a">Les deux flux se succèdent, sans jointure.</text>
  <text x="350" y="173" text-anchor="middle" font-size="11" fill="#57606a">Merge attend la fin des deux entrées.</text>

  <!-- Combine par clé -->
  <rect x="530" y="60" width="320" height="130" rx="10" fill="#ffffff" stroke="#f0883e" stroke-width="2"/>
  <text x="690" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">Combine — par champs correspondants</text>
  <rect x="548" y="100" width="284" height="26" rx="5" fill="#fff4e5"/>
  <text x="690" y="117" text-anchor="middle" font-size="10" fill="#1f2328">Keep Matches = jointure interne (intersection)</text>
  <rect x="548" y="130" width="284" height="26" rx="5" fill="#fff4e5"/>
  <text x="690" y="147" text-anchor="middle" font-size="10" fill="#1f2328">Keep Everything = jointure externe (union)</text>
  <text x="690" y="176" text-anchor="middle" font-size="11" fill="#57606a">Enrich Input 1 / 2 = jointures gauche / droite</text>

  <!-- Position -->
  <rect x="200" y="215" width="300" height="130" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="350" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">Combine — par position</text>
  <text x="350" y="267" text-anchor="middle" font-size="11" fill="#1f2328">item 0 de l'entrée 1</text>
  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#1f2328">⟷ item 0 de l'entrée 2, et ainsi de suite</text>
  <text x="350" y="312" text-anchor="middle" font-size="11" fill="#57606a">Pratique pour deux listes triées à l'identique ;</text>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#57606a">fragile si les ordres divergent.</text>

  <!-- Compare Datasets -->
  <rect x="530" y="215" width="320" height="130" rx="10" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="690" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#1f883d">Compare Datasets (nœud dédié)</text>
  <text x="690" y="267" text-anchor="middle" font-size="11" fill="#1f2328">Compare deux flux et produit jusqu'à</text>
  <text x="690" y="285" text-anchor="middle" font-size="11" fill="#1f2328">quatre sorties : identiques, différents,</text>
  <text x="690" y="303" text-anchor="middle" font-size="11" fill="#1f2328">uniquement dans A, uniquement dans B.</text>
  <text x="690" y="330" text-anchor="middle" font-size="11" fill="#57606a">L'outil des synchronisations incrémentales.</text>

  <!-- Flèches d'entrée -->
  <line x1="160" y1="100" x2="200" y2="100" stroke="#0969da" stroke-width="2"/>
  <polygon points="200,100 190,94 190,106" fill="#0969da"/>
  <line x1="160" y1="280" x2="200" y2="280" stroke="#1f883d" stroke-width="2"/>
  <polygon points="200,280 190,274 190,286" fill="#1f883d"/>
</svg>
