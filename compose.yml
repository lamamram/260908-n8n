services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/home/node/data
  database:
    # la version 18+ de PostgreSQL demande une autre configuration pour le mot de passe, donc on reste sur la version 17
    image: 'docker.io/postgres:17'
    environment:
      POSTGRES_PASSWORD: "roottoor"
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data/
 
  pgadmin:
    # image: 'docker.io/dpage/pgadmin4:latest'
    image: my_pgadmin:latest
    build:
      context: pgadmin
      dockerfile: Dockerfile
    environment:
      PGADMIN_DEFAULT_EMAIL: "me@example.com"
      PGADMIN_DEFAULT_PASSWORD: "roottoor"
    # pgadmin est accessible sur le port 9080 de l'hôte, mais il écoute sur le port 80 à l'intérieur du conteneur
    ports:
      - 9080:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin/

volumes:
  n8n_data:
  pg-data:
  pgadmin-data:
